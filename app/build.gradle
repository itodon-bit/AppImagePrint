plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.photoprint'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.photoprint"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Android標準の印刷フレームワーク(画像印刷を簡単に扱うヘルパー)
    implementation 'androidx.print:print:1.0.0'
    // カメラ撮影用のActivity Result API(AndroidX Activity)
    implementation 'androidx.activity:activity-ktx:1.9.0'
    // 日本語対応のOCR(文字認識)。Google Play Servicesが自動でモデルをダウンロードする
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.0'
    // 撮影画像のEXIF回転情報を読み取るためのライブラリ
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // 自前のカメラ画面(狙いを定める枠を表示するため)に使うCameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
}
